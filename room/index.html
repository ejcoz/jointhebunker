@font-face{font-family:Anton;src:url(/scene/fonts/Anton-Regular.ttf);font-display:swap}
@font-face{font-family:Fredoka;src:url(/scene/fonts/Fredoka-latin.woff2);font-display:swap}
:root{color-scheme:dark;--ink:#efe8d4;--muted:#b3aa90;--gold:#ffc23a;--hz:#f2c230;--red:#ff3b3b}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#140e0a 0%,#3a2312 55%,#5a3417 100%);background-attachment:fixed;color:var(--ink);font-family:Inter,system-ui,sans-serif;min-height:100vh}
main{max-width:460px;margin:0 auto;padding:16px 14px 40px}
a{color:var(--gold)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.back{font:600 14px Fredoka,sans-serif;color:var(--ink);text-decoration:none;opacity:.85}
.coins{font:400 18px Anton,sans-serif;letter-spacing:.04em;background:#1b1a15;border:2px solid var(--gold);color:var(--gold);border-radius:999px;padding:4px 12px;display:flex;align-items:center;gap:6px}
.coins i{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe9a6,#f2c230 55%,#b8860b);display:inline-block;box-shadow:0 0 0 1.5px #6b4a12}
.k{font:400 13px Anton,sans-serif;letter-spacing:.14em;color:var(--muted);margin-top:14px}
h1{font:400 28px Anton,sans-serif;margin:2px 0 12px;letter-spacing:.03em;line-height:1.05;word-break:break-word}h1 b{color:var(--gold);font-weight:400}
#room{width:100%;display:block;border-radius:14px;box-shadow:0 10px 30px #0008;background:#3f3c30}
.mate{display:flex;align-items:center;gap:10px;background:#1b1a15;border:2px solid var(--gold);border-radius:12px;padding:8px 12px;margin-top:12px}
.mate small{display:block;font:700 10px Inter,sans-serif;letter-spacing:.2em;color:var(--muted)}
.mate b{font:400 18px Anton,sans-serif;color:var(--gold);letter-spacing:.04em}
.q{border-left:3px solid var(--gold);padding:6px 10px;margin:10px 0;color:var(--muted);font-size:13px;background:#0003}
p{font-size:15px;line-height:1.45;color:#e2dac4;margin:12px 2px}
.row{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;text-align:center;font:600 16px Fredoka,sans-serif;background:#2e2c24;border:2px solid #8a8670;color:var(--ink);border-radius:12px;padding:12px;cursor:pointer}
.btn.go{background:var(--gold);color:#15100a;border-color:var(--gold)}
h2{font:400 20px Anton,sans-serif;letter-spacing:.05em;margin:22px 0 8px}
.shop{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.it{background:#1b1a15cc;border:1.5px solid #4a3a22;border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px}
.it .n{font:600 15px Fredoka,sans-serif}
.it .d{font-size:12px;color:var(--muted);flex:1}
.it button{font:600 14px Fredoka,sans-serif;border-radius:10px;padding:8px;border:1.5px solid var(--gold);background:transparent;color:var(--gold);cursor:pointer}
.it button.on{background:var(--gold);color:#15100a}
.it button:disabled{opacity:.4;cursor:default}
.fine{font-size:12px;color:var(--muted);margin-top:18px;line-height:1.5}
.lock{text-align:center;padding:40px 10px}
/* game */
#game{position:fixed;inset:0;background:#0c0906ee;display:none;align-items:center;justify-content:center;z-index:9;padding:14px}
#game.on{display:flex}
.gbox{width:100%;max-width:420px}
.ghead{display:flex;justify-content:space-between;font:400 18px Anton,sans-serif;letter-spacing:.05em;margin-bottom:8px}
.bar{height:10px;border-radius:6px;background:#2e2c24;overflow:hidden;margin-bottom:8px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3aa0ff,#1c5fb8);transition:width .2s}
#gsvg{width:100%;display:block;border-radius:14px;background:#2b2820;touch-action:manipulation;user-select:none}
.leak{cursor:pointer}
.spray{animation:spray .5s linear infinite}
@keyframes spray{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(14px)}}
.pop{animation:pop .35s ease-out forwards}
@keyframes pop{to{opacity:0;transform:translateY(-18px)}}
.gmsg{text-align:center;margin-top:12px}
.gmsg b{font:400 26px Anton,sans-serif;color:var(--gold);display:block}

<div class="row"><button class="btn go" id="play" type="button">Patch the pipes · earn coins</button></div>
<h2>FIX UP YOUR ROOM</h2>
<div class="shop" id="shop"></div>
<p class="fine">Coins are earned, never bought. Your room is saved on this phone for now.${pet ? "" : " Asked for a pet in the comments? Your bunkmate moves in at the next manifest update."}</p>`;
draw(); shop();
window.gcEv && gcEv(pet ? "room-open-pet" : "room-open");
$("shop").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.b) { const i = SHOP.find(x => x.id === b.dataset.b); if (st.coins >= i.c) { window.gcEv && gcEv("buy-" + i.id); st.coins -= i.c; st.own.push(i.id); st.on.push(i.id); } }
  if (b.dataset.t) { const id = b.dataset.t; st.on = has(id) ? st.on.filter(x => x !== id) : st.on.concat(id); }
  save(); draw(); shop();
});

// ---------- mini game: patch the pipes ----------
const G = $("game"), gs = $("gsvg");
const JOINTS = []; for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) JOINTS.push([60 + c * 90, 60 + r * 90]);
let game = null;
function board() {
  let s = `<rect width="300" height="300" fill="#2b2820"/>`;
  for (let r = 0; r < 3; r++) s += `<rect x="20" y="${54 + r * 90}" width="260" height="12" fill="#5e5a48" stroke="#121210"/>`;
  for (let c = 0; c < 3; c++) s += `<rect x="${54 + c * 90}" y="20" width="12" height="260" fill="#4b4838" stroke="#121210"/>`;
  JOINTS.forEach(([x, y]) => s += `<circle cx="${x}" cy="${y}" r="13" fill="#6e6a56" stroke="#121210" stroke-width="2"/>`);
  return s + `<g id="leaks"></g><g id="fx"></g>`;
}
function startGame() {
  gs.innerHTML = board(); G.classList.add("on"); window.gcEv && gcEv("game-start"); $("gmsg").innerHTML = "Tap the leaks before the room floods.";
  game = { t: 30, flood: 0, got: 0, live: new Map(), next: 0, over: false, last: performance.now() };
  requestAnimationFrame(tick);
}
function spawn() {
  const free = JOINTS.map((_, i) => i).filter(i => !game.live.has(i)); if (!free.length) return;
  const i = free[Math.floor(Math.random() * free.length)], [x, y] = JOINTS[i];
  const g = document.createElementNS("http://www.w3.org/2000/svg", "g"); g.setAttribute("class", "leak"); g.dataset.i = i;
  g.innerHTML = `<circle cx="${x}" cy="${y}" r="30" fill="transparent"/><circle cx="${x}" cy="${y}" r="14" fill="none" stroke="#3aa0ff" stroke-width="3"/>` +
    [-12, 0, 12].map(dx => `<circle class="spray" cx="${x + dx}" cy="${y + 10}" r="3" fill="#7cc4ff" style="animation-delay:${Math.random() * .5}s"/>`).join("");
  $("leaks").appendChild(g); game.live.set(i, { g, born: game.t });
}
gs.addEventListener("pointerdown", e => {
  if (!game || game.over) return; const g = e.target.closest(".leak"); if (!g) return;
  const i = +g.dataset.i, [x, y] = JOINTS[i]; g.remove(); game.live.delete(i); game.got++;
  const fx = document.createElementNS("http://www.w3.org/2000/svg", "text"); fx.setAttribute("x", x); fx.setAttribute("y", y - 18); fx.setAttribute("text-anchor", "middle"); fx.setAttribute("class", "pop");
  fx.setAttribute("style", "font:400 16px Anton,sans-serif;fill:#ffc23a"); fx.textContent = "+1"; $("fx").appendChild(fx); setTimeout(() => fx.remove(), 400);
  const pt = document.createElementNS("http://www.w3.org/2000/svg", "g"); pt.setAttribute("class", "pop"); pt.innerHTML = `<circle cx="${x}" cy="${y}" r="9" fill="#9a9a9a" stroke="#121210" stroke-width="2"/><path d="M${x - 6} ${y - 6} l12 12 M${x + 6} ${y - 6} l-12 12" stroke="#5e5a48" stroke-width="2"/>`;
  $("fx").appendChild(pt); setTimeout(() => pt.remove(), 400);
});
function tick(now) {
  if (!game || game.over) return;
  const dt = Math.min(.1, (now - game.last) / 1000); game.last = now; game.t -= dt;
  const pace = 1.1 - .7 * (1 - game.t / 30);           // gets faster
  game.next -= dt; if (game.next <= 0) { spawn(); game.next = pace * (.6 + Math.random() * .6); }
  game.flood += dt * game.live.size * 2.4;
  $("gflood").style.width = Math.min(100, game.flood) + "%"; $("gtime").textContent = Math.max(0, Math.ceil(game.t));
  if (game.t <= 0 || game.flood >= 100) return endGame(game.flood >= 100);
  requestAnimationFrame(tick);
}
function endGame(flooded) {
  game.over = true; const earned = game.got;
  window.gcEv && gcEv("game-score-" + (earned < 10 ? "0-9" : earned < 20 ? "10-19" : earned < 40 ? "20-39" : earned < 70 ? "40-69" : "70plus"));
  st.coins += earned; save(); draw(); shop();
  $("gmsg").innerHTML = `<b>${flooded ? "FLOODED" : "PIPES HOLDING"}</b>You patched ${earned} leak${earned === 1 ? "" : "s"}. +${earned} coins.<div class="row"><button class="btn" id="gx" type="button">Back to my room</button><button class="btn go" id="gy" type="button">Again</button></div>`;
  $("gx").onclick = () => G.classList.remove("on"); $("gy").onclick = startGame;
}
$("play").addEventListener("click", startGame);
}
}
</script>
</body></html>
