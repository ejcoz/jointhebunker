<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block;width:100vw;height:100vh}</style>
</head><body><canvas id="c" width="1080" height="1080"></canvas>
<script>
// Copied from Flip-finder enter-the-bunker-test/site-floors (render engine). Site hooks: window.HAS, window.DOOR, window.YOU.
// Floor stills for jointhebunker.com: one interior per level, in the Enter the Bunker palette.
// Eye-level view inside a round concrete silo floor. ?f=1..8
const Q = new URLSearchParams(location.search), FQ = Q.get('f') || '3', F = isNaN(+FQ) ? FQ : +FQ;
const W = +(Q.get('w') || 1080), H = +(Q.get('h') || 1080), cv = document.getElementById('c'); cv.width = W; cv.height = H; const ctx = cv.getContext('2d');
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; };
const [glowC, gx] = mk(W / 2, H / 2);           // half-res light layer, blurred and added
const P = { shell: '#A9A48C', shellS: '#6C6855', inner: '#1C2016', cell: '#2E3625', slab: '#12140D', amber: '#F2C230', gold: '#FFC23A', red: '#FF3B3B', green: '#9CF04A', warm: '#FFD27A' };
function rng(s) { return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R0 = rng(1000 + (typeof F === 'number' ? F : 99));
const full = h => h.length === 4 ? '#' + [...h.slice(1)].map(x => x + x).join('') : h;
const hex = (h, a = 1) => { h = full(h); const n = parseInt(h.slice(1), 16); return `rgba(${n >> 16},${n >> 8 & 255},${n & 255},${a})`; };
const mix = (a, b, t) => { a = full(a); b = full(b); const p = x => [parseInt(x.slice(1, 3), 16), parseInt(x.slice(3, 5), 16), parseInt(x.slice(5, 7), 16)]; const A = p(a), B = p(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); };

// ---------- camera ----------
const CAM = { x: 0, y: 1.65, z: -7.2 }; let FOC = W * .555, HZ = H * .42;
const R = 10, CEIL = 4.4;
function pj(x, y, z) { const d = z - CAM.z; if (d < .15) return null; return [W / 2 + FOC * (x - CAM.x) / d, HZ - FOC * (y - CAM.y) / d, d]; }
const wallP = (phi, y, ins = 0) => [(R - ins) * Math.sin(phi), y, (R - ins) * Math.cos(phi)];
const D2R = Math.PI / 180;
function poly(c, pts, fill, stroke, lw) { const q = pts.map(p => pj(...p)); if (q.some(v => !v)) return false; c.beginPath(); q.forEach((p, i) => i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1])); c.closePath(); if (fill) { c.fillStyle = fill; c.fill(); } if (stroke) { c.strokeStyle = stroke; c.lineWidth = lw || 1; c.stroke(); } return true; }
function line3(c, pts, col, w3, cap = 'round') { // width in world units
  for (let i = 0; i < pts.length - 1; i++) { const a = pj(...pts[i]), b = pj(...pts[i + 1]); if (!a || !b) continue; c.strokeStyle = col; c.lineCap = cap; c.lineWidth = Math.max(.6, FOC * w3 / ((a[2] + b[2]) / 2)); c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]); c.stroke(); }
}
function glow(x, y, z, r3, col, a = 1, g = gx) { const p = pj(x, y, z); if (!p) return; const r = FOC * r3 / p[2] / 2; const gr = g.createRadialGradient(p[0] / 2, p[1] / 2, 0, p[0] / 2, p[1] / 2, r); gr.addColorStop(0, hex(col, a)); gr.addColorStop(.35, hex(col, a * .35)); gr.addColorStop(1, hex(col, 0)); g.fillStyle = gr; g.beginPath(); g.arc(p[0] / 2, p[1] / 2, r, 0, 7); g.fill(); }
function glowLine(pts, col, w3, a = 1) { gx.save(); gx.scale(.5, .5); gx.filter = 'blur(10px)'; line3(gx, pts, hex(col, a), w3); gx.restore(); }

// ---------- objects (painter-sorted) ----------
const OBJ = []; const add = (z, fn) => OBJ.push({ z, fn });
// oriented box: centre (x,z), yaw so the box faces the room centre, size w(along) d(depth) h, base y0
function box(c, cx, cz, yaw, w, d, h, y0, col, opt = {}) {
  const ct = Math.cos(yaw), st = Math.sin(yaw), t = [ct, 0, -st], n = [st, 0, ct];
  const P3 = (u, v, y) => [cx + t[0] * u + n[0] * v, y, cz + t[2] * u + n[2] * v];
  const hw = w / 2, hd = d / 2, y1 = y0 + h;
  const faces = [
    { pts: [P3(-hw, -hd, y0), P3(hw, -hd, y0), P3(hw, -hd, y1), P3(-hw, -hd, y1)], nrm: [-n[0], 0, -n[2]], sh: 1 },
    { pts: [P3(-hw, hd, y0), P3(hw, hd, y0), P3(hw, hd, y1), P3(-hw, hd, y1)], nrm: n, sh: .55 },
    { pts: [P3(-hw, -hd, y0), P3(-hw, hd, y0), P3(-hw, hd, y1), P3(-hw, -hd, y1)], nrm: [-t[0], 0, -t[2]], sh: .7 },
    { pts: [P3(hw, -hd, y0), P3(hw, hd, y0), P3(hw, hd, y1), P3(hw, -hd, y1)], nrm: t, sh: .7 },
    { pts: [P3(-hw, -hd, y1), P3(hw, -hd, y1), P3(hw, hd, y1), P3(-hw, hd, y1)], nrm: [0, 1, 0], sh: 1.18 },
    { pts: [P3(-hw, -hd, y0), P3(hw, -hd, y0), P3(hw, hd, y0), P3(-hw, hd, y0)], nrm: [0, -1, 0], sh: .4 },
  ];
  const vis = faces.filter(f => { const m = f.pts.reduce((a, p) => [a[0] + p[0] / 4, a[1] + p[1] / 4, a[2] + p[2] / 4], [0, 0, 0]); const v = [CAM.x - m[0], CAM.y - m[1], CAM.z - m[2]]; return v[0] * f.nrm[0] + v[1] * f.nrm[1] + v[2] * f.nrm[2] > 0; });
  for (const f of vis) { const k = f.sh * (opt.lit || 1); poly(c, f.pts, k >= 1 ? mix(col, '#ffffff', Math.min(.5, (k - 1))) : mix(col, '#000000', 1 - k), opt.edge || 'rgba(0,0,0,.35)', 1); }
  return { P3, y1, t, n };
}
// facing-centre yaw for an object at (x,z)
const yawAt = (x, z) => Math.atan2(x, z);
function cylY(c, cx, cz, r, y0, h, col, segs = 22, opt = {}) { // vertical cylinder
  const sides = [];
  for (let i = 0; i < segs; i++) { const a0 = i / segs * 2 * Math.PI, a1 = (i + 1) / segs * 2 * Math.PI; const am = (a0 + a1) / 2; const nx = Math.sin(am), nz = Math.cos(am); const mx = cx + nx * r, mz = cz + nz * r; const v = [CAM.x - mx, 0, CAM.z - mz]; if (v[0] * nx + v[2] * nz <= 0) continue; const lit = .45 + .55 * Math.max(0, (nx * -.5 + nz * -.85)); sides.push({ a0, a1, lit }); }
  for (const s of sides) poly(c, [[cx + Math.sin(s.a0) * r, y0, cz + Math.cos(s.a0) * r], [cx + Math.sin(s.a1) * r, y0, cz + Math.cos(s.a1) * r], [cx + Math.sin(s.a1) * r, y0 + h, cz + Math.cos(s.a1) * r], [cx + Math.sin(s.a0) * r, y0 + h, cz + Math.cos(s.a0) * r]], mix(col, '#000', 1 - s.lit * (opt.k || 1)), opt.edge || null);
  if (opt.top !== false && y0 + h < CAM.y) { const pts = []; for (let i = 0; i < segs; i++) { const a = i / segs * 2 * Math.PI; pts.push([cx + Math.sin(a) * r, y0 + h, cz + Math.cos(a) * r]); } poly(c, pts, mix(col, '#fff', .12), 'rgba(0,0,0,.3)'); }
}
function disc(c, cx, y, cz, r, fill, stroke, lw, segs = 40) { const pts = []; for (let i = 0; i < segs; i++) { const a = i / segs * 2 * Math.PI; pts.push([cx + Math.sin(a) * r, y, cz + Math.cos(a) * r]); } return poly(c, pts, fill, stroke, lw); }
// a circle lying on the wall at angle phi
function wallDisc(c, phi, yc, r, ins, fill, stroke, lw, segs = 36) { const t = [Math.cos(phi), 0, -Math.sin(phi)]; const b = wallP(phi, yc, ins); const pts = []; for (let i = 0; i < segs; i++) { const a = i / segs * 2 * Math.PI; pts.push([b[0] + t[0] * Math.cos(a) * r, yc + Math.sin(a) * r, b[2] + t[2] * Math.cos(a) * r]); } return poly(c, pts, fill, stroke, lw); }

// ---------- the room shell ----------
function shell(o) {
  const c = ctx, wc = o.wall || '#4a4838', fl = o.floor || '#23251b', ce = o.ceil || '#16170f';
  c.fillStyle = ce; c.fillRect(0, 0, W, H);
  // floor
  const fg = c.createLinearGradient(0, HZ, 0, H); fg.addColorStop(0, mix(fl, '#000', .2)); fg.addColorStop(1, fl); c.fillStyle = fg; c.fillRect(0, HZ - 40, W, H);
  // ceiling ribs (radial beams) and ring
  for (let k = -6; k <= 6; k++) { const ph = k * 15 * D2R; line3(c, [[0, CEIL, 0], wallP(ph, CEIL, .2)], mix(ce, '#000', .4), .35); }
  // ceiling: cross beams that fill the space above the camera, plus a soft bounce of light
  for (let z = -6.4; z < 9.6; z += 1.6) { const hw = Math.sqrt(Math.max(0, R * R - z * z)); add(40, c => { line3(c, [[-hw, CEIL - .02, z], [hw, CEIL - .02, z]], mix(ce, '#000', .45), .22, 'butt'); line3(c, [[-hw, CEIL - .14, z], [hw, CEIL - .14, z]], mix(ce, '#ffffff', .06), .03, 'butt'); }); }
  // floor slab seams
  for (let z = -6; z < 10; z += 2.2) { const hw = Math.sqrt(Math.max(0, R * R - z * z)); line3(c, [[-hw, .003, z], [hw, .003, z]], 'rgba(0,0,0,.22)', .03); }
  for (let x = -8.8; x <= 8.8; x += 2.2) line3(c, [[x, .003, -6.5], [x, .003, Math.sqrt(R * R - x * x)]], 'rgba(0,0,0,.18)', .03);
  // wall strips
  const st = 1.5 * D2R;
  for (let ph = -130 * D2R; ph < 130 * D2R; ph += st) {
    const m = ph + st / 2; const facing = Math.cos(m); const k = .55 + .45 * Math.pow(Math.max(0, facing), .6);
    const col = mix(wc, '#000', 1 - k);
    const g = (() => { const a = pj(...wallP(m, CEIL, 0)), b = pj(...wallP(m, 0, 0)); if (!a || !b) return col; const gr = c.createLinearGradient(0, a[1], 0, b[1]); gr.addColorStop(0, mix(col, '#000', .35)); gr.addColorStop(.55, col); gr.addColorStop(1, mix(col, '#000', .25)); return gr; })();
    wallRect(c, ph, ph + st + .002, 0, CEIL, 0, g);
  }
  // formwork lines and seams
  for (const y of [1.45, 2.9]) { const pts = []; for (let ph = -125; ph <= 125; ph += 2) pts.push(wallP(ph * D2R, y, .01)); line3(c, pts, 'rgba(0,0,0,.28)', .03); }
  for (let ph = -120; ph <= 120; ph += 12) line3(c, [wallP(ph * D2R, 0, .01), wallP(ph * D2R, CEIL, .01)], 'rgba(0,0,0,.22)', .025);
  // stains
  for (let i = 0; i < 46; i++) { const ph = (R0() * 230 - 115) * D2R, y = R0() * CEIL, s = .2 + R0() * .7; const a = pj(...wallP(ph, y, .02)); if (!a) continue; const r = FOC * s / a[2]; const gr = c.createRadialGradient(a[0], a[1], 0, a[0], a[1], r); gr.addColorStop(0, 'rgba(10,9,5,.22)'); gr.addColorStop(1, 'rgba(10,9,5,0)'); c.fillStyle = gr; c.beginPath(); c.ellipse(a[0], a[1] + r * .6, r * .6, r * 1.4, 0, 0, 7); c.fill(); }
  // drip streaks
  for (let i = 0; i < 30; i++) { const ph = (R0() * 230 - 115) * D2R, y = 2 + R0() * 2.3; line3(c, [wallP(ph, y, .02), wallP(ph, y - .6 - R0() * 1.2, .02)], 'rgba(15,13,8,.18)', .04 + R0() * .05); }
  // ring beam at top, hazard skirting at base
  wallRect(c, -130 * D2R, 130 * D2R, CEIL - .28, CEIL, .02, mix(wc, '#000', .45));
  for (let ph = -126; ph < 126; ph += 2.4) { const k = Math.round((ph + 126) / 2.4) % 2; wallRect(c, ph * D2R, (ph + 2.4) * D2R, 0, .22, .03, k ? P.amber : '#16140c'); }
  // floor grime and the dashed hazard ring
  for (let i = 0; i < 40; i++) { const r = Math.sqrt(R0()) * 9.4, a = (R0() * 2 - 1) * Math.PI; const x = Math.sin(a) * r, z = Math.cos(a) * r; const p = pj(x, 0, z); if (!p) continue; const s = FOC * (.4 + R0()) / p[2]; const gr = c.createRadialGradient(p[0], p[1], 0, p[0], p[1], s); gr.addColorStop(0, 'rgba(0,0,0,.25)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); c.fillStyle = gr; c.beginPath(); c.ellipse(p[0], p[1], s, s * .35, 0, 0, 7); c.fill(); }
  if (o.ring !== false) for (let a = -180; a < 180; a += 6) { const r = 8.6; line3(c, [[Math.sin(a * D2R) * r, .005, Math.cos(a * D2R) * r], [Math.sin((a + 3.2) * D2R) * r, .005, Math.cos((a + 3.2) * D2R) * r]], hex(P.amber, .55), .09, 'butt'); }
  // stencil level marks high on the wall, off-centre (shapes only, no letters)
  for (const ph of o.marks || [-58, 58]) { wallRect(c, (ph - 4) * D2R, (ph + 4) * D2R, 3.25, 3.85, .02, hex(P.amber, .85)); for (let i = 0; i < 4; i++) wallRect(c, (ph - 3.3 + i * 1.8) * D2R, (ph - 2.3 + i * 1.8) * D2R, 3.36, 3.74, .025, '#1b190f'); }
}
// bunks built into the curved wall, as in episode 1's cutaway: tiers of recessed bays with a green light strip
function bunkWall(phiA, phiB, ys, seed, opt = {}) {
  const Rb = rng(seed), bayDeg = opt.bay || 11, h = opt.h || .78, blank = opt.blanket || ['#5d6e45', '#6e5a40', '#4d5f60', '#76694c', '#585a70', '#7a4a3a'];
  const n = Math.max(1, Math.round(Math.abs(phiB - phiA) / bayDeg)), step = (phiB - phiA) / n;
  add(R + 6, c => {
    for (let i = 0; i < n; i++) for (const y of ys) {
      const a0 = (phiA + step * i) * D2R, a1 = (phiA + step * (i + 1)) * D2R, g = .25 * D2R * Math.sign(step);
      wallRect(c, a0, a1, y - .1, y + h + .08, .015, '#5f5b48', 'rgba(0,0,0,.35)', 1);              // concrete frame
      wallRect(c, a0 + g * 1.2, a1 - g * 1.2, y, y + h, .03, '#0f100b');                                // dark recess
      wallRect(c, a0 + g * 1.6, a1 - g * 1.6, y + h * .55, y + h - .04, .035, '#171811');               // back wall of the bay
      const bl = blank[Math.floor(Rb() * blank.length)];
      wallRect(c, a0 + g * 1.6, a1 - g * 1.6, y + .04, y + .3, .04, bl);                               // mattress + blanket
      wallRect(c, a0 + g * 1.6, a1 - g * 1.6, y + .24, y + .3, .05, mix(bl, '#ffffff', .18));         // blanket fold
      const pw = (a1 - a0) * .2; wallRect(c, a1 - g * 2 - pw, a1 - g * 2, y + .27, y + .45, .05, '#d6cfb4');   // pillow
      wallRect(c, a0 + g, a1 - g, y - .06, y + .02, .05, '#2a2b22');                                    // bunk lip
      if (y === ys[0] && i % 2 === 0) { const la = a0 + g * .6; line3(c, [wallP(la, 0, .12), wallP(la, ys[ys.length - 1] + h, .12)], '#6b6650', .03); }
      if (Rb() < (opt.lampP ?? .45)) { const m = (a0 + a1) / 2 - (a1 - a0) * .25; const p = wallP(m, y + h - .14, .06); glow(...p, .7, '#FFD27A', .75); wallRect(c, m - g * 1.5, m + g * 1.5, y + h - .2, y + h - .1, .055, '#ffe3a6'); }
    }
  });
  for (const y of ys) { const pts = []; for (let a = phiA; Math.sign(step) * (phiB - a) >= 0; a += step / 4) pts.push(wallP(a * D2R, y - .02, .06)); add(R + 5.9, c => line3(c, pts, P.green, .025, 'butt')); glowLine(pts, P.green, .16, .7); }
}
// the dormitory door: a big round vault door, swung slightly open onto the floor's bunk wing
function dormDoor(phi, yc, r, openDeg = 28, seed = 1) {
  const ph = phi * D2R, t = [Math.cos(ph), 0, -Math.sin(ph)], nIn = [-Math.sin(ph), 0, -Math.cos(ph)];
  const Rd = rng(seed);
  add(R + 4, c => {
    // hazard frame and collar
    wallDisc(c, ph, yc, r * 1.32, .01, '#2b2a20');
    for (let i = 0; i < 28; i++) { const a0 = i / 28 * 2 * Math.PI, a1 = (i + 1) / 28 * 2 * Math.PI; const b = wallP(ph, yc, .015); const P4 = (a, rr) => [b[0] + t[0] * Math.cos(a) * rr, yc + Math.sin(a) * rr, b[2] + t[2] * Math.cos(a) * rr]; poly(c, [P4(a0, r * 1.18), P4(a1, r * 1.18), P4(a1, r * 1.3), P4(a0, r * 1.3)], i % 2 ? P.amber : '#15130c'); }
    wallDisc(c, ph, yc, r * 1.12, .02, '#6c6a5b', '#22211a', 2);
    // the opening: warm light and bunks inside (clipped to the doorway)
    const q = []; const b0 = wallP(ph, yc, .03); for (let i = 0; i < 40; i++) { const a = i / 40 * 2 * Math.PI; const pp = pj(b0[0] + t[0] * Math.cos(a) * r, yc + Math.sin(a) * r, b0[2] + t[2] * Math.cos(a) * r); if (pp) q.push(pp); }
    c.save(); c.beginPath(); q.forEach((p, i) => i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1])); c.closePath(); c.clip();
    const cx = q.reduce((a, p) => a + p[0], 0) / q.length, cy = q.reduce((a, p) => a + p[1], 0) / q.length, rr = Math.max(...q.map(p => Math.hypot(p[0] - cx, p[1] - cy))); window.DOOR = [cx / W, cy / H, rr / W];
    const gr = c.createRadialGradient(cx, cy + rr * .2, 0, cx, cy, rr * 1.2); gr.addColorStop(0, '#d9a75a'); gr.addColorStop(.6, '#6e4f2a'); gr.addColorStop(1, '#1a140c'); c.fillStyle = gr; c.fillRect(cx - rr * 1.5, cy - rr * 1.5, rr * 3, rr * 3);
    // receding bunk tiers seen through the door
    for (let k = 0; k < 6; k++) { const d = 1 - k * .13; const w = rr * 2.2 * d, x0 = cx - w / 2; for (let j = 0; j < 4; j++) { const y = cy - rr * .75 * d + j * rr * .42 * d; c.fillStyle = `rgba(20,16,10,${.55 + k * .06})`; c.fillRect(x0, y, w * .38, rr * .08 * d); c.fillRect(x0 + w * .62, y, w * .38, rr * .08 * d); c.fillStyle = `rgba(156,240,74,${.5 - k * .07})`; c.fillRect(x0, y + rr * .08 * d, w * .38, 1.2); c.fillRect(x0 + w * .62, y + rr * .08 * d, w * .38, 1.2); if (Rd() < .4) { c.fillStyle = 'rgba(255,214,140,.85)'; c.beginPath(); c.arc(x0 + w * (Rd() < .5 ? .2 : .8), y - rr * .04 * d, 1.6 + 2 * d, 0, 7); c.fill(); } } }
    c.restore();
    // the door leaf, hinged at its left edge, swung inward toward the room
    const hs = phi > 0 ? 1 : -1, th = openDeg * D2R; const hinge = [b0[0] + hs * t[0] * r, yc, b0[2] + hs * t[2] * r];
    const ax = [-hs * t[0] * Math.cos(th) + nIn[0] * Math.sin(th), 0, -hs * t[2] * Math.cos(th) + nIn[2] * Math.sin(th)];
    const leaf = (rad, off) => { const pts = []; for (let i = 0; i < 40; i++) { const a = i / 40 * 2 * Math.PI; const u = r + Math.cos(a) * rad; pts.push([hinge[0] + ax[0] * u + nIn[0] * off * 0, yc + Math.sin(a) * rad, hinge[2] + ax[2] * u]); } return pts; };
    poly(c, leaf(r * 1.02, 0), '#2e2d25', '#121109', 2); poly(c, leaf(r * .97, 0), '#77756a', '#2a291f', 2); poly(c, leaf(r * .8, 0), '#6a685c'); poly(c, leaf(r * .62, 0), '#605e52', 'rgba(0,0,0,.25)', 1.5);
    // locking bolts and the wheel on the leaf

    const vac = !txt || txt[1] === 'VACANT' || txt[1] === 'RESERVED';
    const xs = x + side * .02, dz0 = z0 + .05, dz1 = z1 - .05, dy0 = y0 + .01, dy1 = y1 - .04;
    // door panel with an inner frame and a seam
    poly(ctx, [[xs, dy0, dz0], [xs, dy0, dz1], [xs, dy1, dz1], [xs, dy1, dz0]], fog(isYou ? '#6b6448' : '#4b4a3c', z0), fog('#1b1c14', z0), 1.4);
    poly(ctx, [[xs, dy0 + .05, dz0 + .06], [xs, dy0 + .05, dz1 - .06], [xs, dy1 - .05, dz1 - .06], [xs, dy1 - .05, dz0 + .06]], null, fog('rgba(0,0,0,.35)', z0), 1);
    line3(ctx, [[xs, dy0 + .03, dz1 - .62], [xs, dy1 - .03, dz1 - .62]], fog('#2a2a20', z0), .012);
    // a gold seam of light leaks out around your door
    if (isYou) { line3(ctx, [[xs, dy0, dz0], [xs, dy0, dz1], [xs, dy1, dz1], [xs, dy1, dz0], [xs, dy0, dz0]], P.gold, .02); glow(xs, (y0 + y1) / 2, (z0 + z1) / 2, 1.5, P.gold, .28); }
    // porthole near the pillow end
    const yc = (dy0 + dy1) / 2 + .02, zc = dz1 - .32, pr = .12, ring = [], hole = [];
    for (let i = 0; i < 20; i++) { const a = i / 20 * 2 * Math.PI; ring.push([xs, yc + Math.sin(a) * pr * 1.25, zc + Math.cos(a) * pr * 1.25]); hole.push([xs, yc + Math.sin(a) * pr, zc + Math.cos(a) * pr]); }
    poly(ctx, ring, fog('#6f6a54', z0)); poly(ctx, hole, isYou ? P.gold : vac ? '#0b0c08' : fog('#3a2f1c', z0));
    if (!vac && !isYou && (pid * 7) % 5 < 2) glow(xs, yc, zc, .4, '#FFD27A', .35 * (1 - Math.min(1, z0 / 24)));
    if (isYou) { glow(xs, yc, zc, .5, P.gold, .6); const c0 = pj(xs, yc, (dz0 + dz1) / 2); if (c0) window.YOU = [c0[0] / W, c0[1] / H]; }
    // name plate: bed number on dark, handle on a light strip below
    const za = dz0 + .12, zb = zc - pr * 1.25 - .1, pa0 = yc - .02, pa1 = yc + .16, pb0 = yc - .19, pb1 = yc - .04;
    poly(ctx, [[xs, pa0, za], [xs, pa0, zb], [xs, pa1, zb], [xs, pa1, za]], fog('#14130c', z0), isYou ? P.gold : fog('#8a7a3a', z0), 1.2);
    poly(ctx, [[xs, pb0, za], [xs, pb0, zb], [xs, pb1, zb], [xs, pb1, za]], isYou ? P.gold : vac ? fog('#2c2c22', z0) : fog('#e9e4d2', z0));
    if (blank || !txt) return;
    plateText(xs, pa0, pa1, za, zb, txt[0], f => `${f}px Anton`, isYou ? P.gold : fog(P.amber, z0), z0, .74);
    plateText(xs, pb0, pb1, za, zb, txt[1], f => `${isYou ? 700 : 600} ${f}px Fredoka`, isYou ? '#1a1206' : vac ? fog('#77735e', z0) : '#1d1c16', z0);
  }
  const Rh = rng(404);
  // floor, ceiling and the far darkness
  ctx.fillStyle = '#070805'; ctx.fillRect(0, 0, W, H);
  for (const side of [-1, 1]) { poly(ctx, [[side * HW, 0, -1.4], [side * HW, 0, .06], [side * HW, TOP + .25, .06], [side * HW, TOP + .25, -1.4]], '#4a4738'); }
  poly(ctx, [[-HW, 0, -1.4], [HW, 0, -1.4], [HW, 0, 0], [-HW, 0, 0]], '#2f3125'); poly(ctx, [[-HW, TOP + .25, -1.4], [HW, TOP + .25, -1.4], [HW, TOP + .25, 0], [-HW, TOP + .25, 0]], '#1d1e16');
  for (let k = N; k >= 0; k--) { const z0 = k * CELL, z1 = z0 + CELL; poly(ctx, [[-HW, 0, z0], [HW, 0, z0], [HW, 0, z1], [-HW, 0, z1]], fog(k % 2 ? '#2b2d22' : '#2f3125', z0)); poly(ctx, [[-HW, TOP + .25, z0], [HW, TOP + .25, z0], [HW, TOP + .25, z1], [-HW, TOP + .25, z1]], fog('#1d1e16', z0)); }
  // dashed amber line down the middle of the floor (episode 1's corridor)
  for (let z = 0; z < N * CELL; z += .9) poly(ctx, [[-.05, .005, z], [.05, .005, z], [.05, .005, z + .45], [-.05, .005, z + .45]], fog(P.amber, z));
  const platesOut = [];
  // the two walls of bunk cells, far to near
  for (let k = N - 1; k >= 0; k--) for (const side of [-1, 1]) {
    const z0 = k * CELL + .06, z1 = z0 + CELL - .12, x = side * HW, xb = side * (HW + DEEP);
    // pillar between cells
    poly(ctx, [[x, 0, z0 - .12], [x, 0, z0], [x, TOP + .25, z0], [x, TOP + .25, z0 - .12]], fog('#5f5b48', z0));
    poly(ctx, [[x, 0, z1], [x, 0, z1 + .12], [x, TOP + .25, z1 + .12], [x, TOP + .25, z1]], fog('#5f5b48', z0));
    if (k % 2 === 0) { line3(ctx, [[x - side * .06, 0, z1 - .25], [x - side * .06, TOP, z1 - .25]], fog('#77725a', z0), .035); for (let r = .3; r < TOP; r += .3) line3(ctx, [[x - side * .06, r, z1 - .25], [x - side * .06, r, z1 - .05]], fog('#77725a', z0), .02); }
    // header beam
    poly(ctx, [[x, TOP, z0], [x, TOP, z1], [x, TOP + .25, z1], [x, TOP + .25, z0]], fog('#55513f', z0));
    for (let ti = 0; ti < TIERS.length; ti++) {
      const [y0, y1] = TIERS[ti];
      // recess: back, ceiling of the bay, and the far side wall of the bay (seen in perspective)
      poly(ctx, [[xb, y0, z0], [xb, y0, z1], [xb, y1, z1], [xb, y1, z0]], fog('#121309', z0));
      poly(ctx, [[x, y1, z0], [xb, y1, z0], [xb, y1, z1], [x, y1, z1]], fog('#1a1b12', z0));
      poly(ctx, [[x, y0, z1], [xb, y0, z1], [xb, y1, z1], [x, y1, z1]], fog('#24251b', z0));
      // mattress and blanket, pillow at the far end
      const bl = ['#5d6e45', '#6e5a40', '#4d5f60', '#76694c', '#585a70', '#7a4a3a'][Math.floor(Rh() * 6)];
      const ym = y0 + .22;
      poly(ctx, [[x, ym, z0 + .05], [xb, ym, z0 + .05], [xb, ym, z1 - .05], [x, ym, z1 - .05]], fog(mix(bl, '#000000', .12), z0));
      poly(ctx, [[x, y0 + .02, z0 + .05], [x, ym, z0 + .05], [x, ym, z1 - .05], [x, y0 + .02, z1 - .05]], fog(bl, z0));
      box(ctx, x + side * .48, z1 - .3, 0, .55, .34, .07, ym, fog(mix(bl, '#d8d0b4', .55), z0), { edge: 'rgba(0,0,0,.18)' });
      poly(ctx, [[x + side * .02, ym + .005, z0 + .4], [xb - side * .05, ym + .005, z0 + .4], [xb - side * .05, ym + .005, z0 + .55], [x + side * .02, ym + .005, z0 + .55]], fog(mix(bl, '#000000', .25), z0));
      // reading lamp in some bays
      if (Rh() < .4) { glow(xb - side * .05, y1 - .12, z0 + .4, .8, '#FFD27A', .55 * (1 - Math.min(1, z0 / 26))); }
      // bay frame
      poly(ctx, [[x, y0 - .08, z0], [x, y0, z0], [x, y0, z1], [x, y0 - .08, z1]], fog('#6a6651', z0));
      // green light strip along the lip
      poly(ctx, [[x, y0 - .02, z0 + .02], [x, y0 + .005, z0 + .02], [x, y0 + .005, z1 - .02], [x, y0 - .02, z1 - .02]], fog(P.green, z0 * .6));
      glowLine([[x, y0, z0], [x, y0, z1]], P.green, .06, .45 * (1 - Math.min(1, z0 / 30)));
      podDoor(x, side, k, ti, z0, z1, y0, y1, xb);
    }
    // a name plate per cell, on the pillar face beside the middle bay
    platesOut.push({ side, k, z0, x });
  }
  // ceiling light panels
  for (let k = N - 1; k >= 0; k -= 1) if (k % 2 === 0) { const z = k * CELL + CELL / 2; poly(ctx, [[-.45, TOP + .24, z - .35], [.45, TOP + .24, z - .35], [.45, TOP + .24, z + .35], [-.45, TOP + .24, z + .35]], fog('#e9e3c8', z * .7)); glow(0, TOP + .2, z, 2.6, '#FFE7B0', .4 * (1 - Math.min(1, z / 30))); }
  // pipes along the top corners
  for (const side of [-1, 1]) { line3(ctx, [[side * (HW - .05), TOP + .1, 0], [side * (HW - .05), TOP + .1, N * CELL]], '#3b3a2e', .07); }
  // the far end fades into darkness
  const vz = pj(0, 1.3, N * CELL); if (vz) { const gr = ctx.createRadialGradient(vz[0], vz[1], 0, vz[0], vz[1], W * .18); gr.addColorStop(0, 'rgba(7,8,5,1)'); gr.addColorStop(1, 'rgba(7,8,5,0)'); ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H); }
  finish({ haze: '#c8c09a', hazeA: .06, dustCol: '#e8dcc0', dust: Math.round(120 * W * H / 1166400), vig: .62, glowA: .8 });
};

window.HAS = !!SCENES[F];
(async () => { if (SCENES[F]) await SCENES[F](); else { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); window.READY = true; } })();
</script></body></html>
