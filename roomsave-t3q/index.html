<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
@font-face{font-family:Anton;src:url(/scene/fonts/Anton-Regular.ttf);font-display:swap}
@font-face{font-family:Fredoka;src:url(/scene/fonts/Fredoka-latin.woff2);font-display:swap}
:root{color-scheme:dark;--ink:#efe8d4;--muted:#b3aa90;--gold:#ffc23a;--red:#ff3b3b}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#140e0a 0%,#3a2312 55%,#5a3417 100%);background-attachment:fixed;color:var(--ink);font-family:Inter,system-ui,sans-serif;min-height:100vh}
main{max-width:460px;margin:0 auto;padding:14px 14px 40px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.back{font:600 14px Fredoka,sans-serif;color:var(--ink);text-decoration:none;opacity:.85}
.coins{font:400 18px Anton,sans-serif;letter-spacing:.04em;background:#1b1a15;border:2px solid var(--gold);color:var(--gold);border-radius:999px;padding:4px 12px;display:flex;align-items:center;gap:6px}
.coins i,.cp i{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe9a6,#f2c230 55%,#b8860b);display:inline-block;box-shadow:0 0 0 1.5px #6b4a12;vertical-align:-2px}
.k{font:400 13px Anton,sans-serif;letter-spacing:.14em;color:var(--muted);margin-top:12px}
h1{font:400 28px Anton,sans-serif;margin:2px 0 10px;letter-spacing:.03em;line-height:1.05;word-break:break-word}h1 b{color:var(--gold);font-weight:400}
.roomwrap{display:flex;justify-content:center}
#room{width:100%;display:block;border-radius:14px;box-shadow:0 10px 30px #0008;background:#3f3c30;transition:height .25s}
body.sheetopen #room{width:auto;height:calc(48vh - 135px);min-height:190px}
body.sheetopen .hint,body.sheetopen .fine{display:none}
body.gameopen{overflow:hidden}
.mate{display:flex;align-items:center;gap:10px;background:#1b1a15;border:2px solid var(--gold);border-radius:12px;padding:8px 12px;margin-top:12px}
.mate small{display:block;font:700 10px Inter,sans-serif;letter-spacing:.2em;color:var(--muted)}
.mate b{font:400 18px Anton,sans-serif;color:var(--gold);letter-spacing:.04em}
p{font-size:15px;line-height:1.45;color:#e2dac4;margin:12px 2px}
.row{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;text-align:center;font:600 16px Fredoka,sans-serif;background:#2e2c24;border:2px solid #8a8670;color:var(--ink);border-radius:12px;padding:12px;cursor:pointer}
.btn.go{background:var(--gold);color:#15100a;border-color:var(--gold)}
h2{font:400 20px Anton,sans-serif;letter-spacing:.05em;margin:22px 0 8px}
.games{display:grid;gap:8px}
.gm{text-align:left;background:#1b1a15cc;border:1.5px solid #4a3a22;border-left:6px solid var(--c);border-radius:12px;padding:12px 14px;color:var(--ink);cursor:pointer;display:grid;gap:3px;font-family:inherit}
.gm b{font:400 19px Anton,sans-serif;letter-spacing:.04em;color:var(--c)}
.gm span{font-size:13px;color:#d8cfb6;line-height:1.35}
.gm em{font:600 12px Fredoka,sans-serif;font-style:normal;color:var(--gold)}
.mini{font:600 13px Fredoka,sans-serif;border-radius:999px;padding:6px 12px;border:1.5px solid var(--gold);background:transparent;color:var(--gold);cursor:pointer}
.coats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.coat{background:#1b1a15;border:1.5px solid #4a3a22;border-radius:10px;padding:4px;color:var(--ink);font:600 11px Fredoka,sans-serif;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.coat svg{width:100%;aspect-ratio:3/2;background:#3a372c;border-radius:6px}.coat.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.test{margin-top:20px;border:2px dashed #ff3b3b;border-radius:12px;padding:12px;font-size:13px}.test b{color:#ff3b3b;font:400 16px Anton,sans-serif;letter-spacing:.08em}.test small{color:var(--muted)}
.test .btn{font-size:13px;padding:9px 6px}.tpets{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.petask{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;background:#1b1a15;border:2px dashed var(--gold);border-radius:12px;padding:12px;margin-top:12px}
.pa-ic{font-size:28px}.pa-t{flex:1;min-width:200px}.pa-t b{display:block;font:400 17px Anton,sans-serif;letter-spacing:.05em;color:var(--gold)}.pa-t span{font-size:13px;color:#d8cfb6;line-height:1.35}
.pa-go{flex:1 1 100%;text-align:center;font:600 15px Fredoka,sans-serif;background:var(--gold);color:#15100a;border-radius:10px;padding:10px;text-decoration:none}
.fine{font-size:12px;color:var(--muted);margin-top:18px;line-height:1.5}
.lock{text-align:center;padding:40px 10px}
/* room animations */
.twinkle{animation:tw 1.6s ease-in-out infinite}@keyframes tw{50%{opacity:.45}}
.tick{transform-origin:0 0;animation:tick 60s steps(60) infinite}@keyframes tick{to{transform:rotate(360deg)}}
.static{animation:stc .25s steps(2) infinite}@keyframes stc{50%{fill:#d8ecff}}
.lava{animation:lava 4s ease-in-out infinite}.lava2{animation:lava 5s ease-in-out infinite reverse}@keyframes lava{50%{transform:translateY(-8px)}}
.snow{animation:snw 3s linear infinite}@keyframes snw{to{transform:translateY(10px);opacity:0}}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flm .5s ease-in-out infinite alternate}@keyframes flm{to{transform:scaleY(1.2) skewX(4deg)}}
.swim{animation:swm 3s ease-in-out infinite alternate}@keyframes swm{to{transform:translateX(-5px)}}
/* dock */
main{padding-bottom:110px}
#dock{position:fixed;left:0;right:0;bottom:0;z-index:7;display:flex;justify-content:space-around;gap:4px;max-width:560px;margin:0 auto;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:#15120e;border-top:2px solid #4a3a22;box-shadow:0 -6px 24px #0009}
#dock button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;color:var(--muted);font:600 13px Fredoka,sans-serif;padding:6px 0;border-radius:12px;cursor:pointer}
#dock svg{width:26px;height:26px;fill:currentColor}
#dock button.on{color:#15100a;background:var(--gold)}
body.nodock #dock{display:none}
.savebox,.restore{background:#1b1a15;border:1.5px solid var(--gold);border-radius:12px;padding:12px 14px;margin-top:12px;font-size:14px;color:#d8cfb6}
.savebox b,.restore b{font:400 16px Anton,sans-serif;letter-spacing:.05em;color:var(--gold)}
.savebox p,.restore p{margin:6px 0 10px}
.savebox input{width:100%;box-sizing:border-box;margin-top:10px;padding:8px 10px;border-radius:8px;border:1px solid #4a3a22;background:#0e0d0a;color:var(--ink);font:500 12px Fredoka,sans-serif}
.restore{border-color:#9CF04A;margin:58px 0 12px;position:relative;z-index:4}.restore b{color:#9CF04A}.restore .row{display:flex;gap:8px;flex-wrap:wrap}
.mini.go{background:var(--gold);color:#17160F}
.hint{position:relative;background:#1b1a15;border:1.5px solid #4a3a22;border-radius:12px;padding:12px 14px;margin-top:12px;font-size:14px;color:#d8cfb6}
.hint>b{font:400 16px Anton,sans-serif;letter-spacing:.06em;color:var(--gold)}.hint ol{margin:6px 0 0;padding-left:20px;line-height:1.5}.hint ol b{color:var(--ink)}
#hintX{position:absolute;top:10px;right:10px;font:600 13px Fredoka,sans-serif;background:none;border:1.5px solid #8a8670;color:var(--ink);border-radius:999px;padding:4px 10px}
.petask.flash{animation:flash 1s ease-out 2}@keyframes flash{50%{box-shadow:0 0 0 6px #ffc23a88}}
.goform{display:flex;align-items:center;gap:8px;background:#1b1a15;border:2px solid #8a8670;border-radius:14px;padding:6px 6px 6px 14px;max-width:360px;margin:16px auto}
.goform span{font:600 18px Fredoka,sans-serif;color:var(--muted)}.goform input{flex:1;min-width:0;background:none;border:0;color:var(--ink);font:600 18px Fredoka,sans-serif;outline:none}.goform .btn{flex:none;padding:10px 18px}
#play .games{overflow-y:auto;padding:0 14px 14px}
/* sheets */
.sheet{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom));height:calc(52vh - 40px);background:#15120e;border-top:3px solid var(--gold);border-radius:18px 18px 0 0;transform:translateY(105%);transition:transform .25s;z-index:8;display:flex;flex-direction:column;max-width:560px;margin:0 auto;box-shadow:0 -10px 40px #000a}
.sheet:not(.on){visibility:hidden;transition:transform .25s,visibility 0s .25s}
.sheet.on{transform:none}
.chead{display:flex;justify-content:space-between;align-items:center;padding:10px 14px 4px}
.chead b{font:400 20px Anton,sans-serif;letter-spacing:.06em}
.sx{font:600 14px Fredoka,sans-serif;background:none;border:1.5px solid #8a8670;color:var(--ink);border-radius:999px;padding:6px 12px}
#tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 14px 8px;scrollbar-width:none}
#tabs button{flex:none;font:600 14px Fredoka,sans-serif;border-radius:999px;padding:6px 12px;background:#2e2c24;color:var(--ink);border:1.5px solid #4a3a22}
#tabs button.on{background:var(--gold);color:#15100a;border-color:var(--gold)}
#grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 14px 10px;align-content:start}
.ci{background:#1b1a15;border:1.5px solid #4a3a22;border-radius:12px;padding:6px;display:flex;flex-direction:column;gap:3px;color:var(--ink);cursor:pointer;font-family:inherit}
.ci svg{width:100%;aspect-ratio:1;border-radius:8px;display:block}
.ci.sel{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.ci.rare{background:linear-gradient(160deg,#2a2210,#1b1a15)}
.cn{font:600 12px Fredoka,sans-serif;line-height:1.15;text-align:left}
.cp{font:400 13px Anton,sans-serif;color:var(--gold);text-align:left;letter-spacing:.03em}
#cbar{display:flex;align-items:center;gap:10px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));border-top:1px solid #4a3a22;min-height:58px}
.cbt{flex:1;font-size:13px;color:var(--muted)}.cbt b{display:block;color:var(--ink);font:600 15px Fredoka,sans-serif}.cbt small{font-size:12px}
.cb{font:600 15px Fredoka,sans-serif;border-radius:12px;padding:10px 14px;border:2px solid #8a8670;background:#2e2c24;color:var(--ink)}
.cb.go{background:var(--gold);color:#15100a;border-color:var(--gold)}.cb:disabled{opacity:.55}
/* game */
#game{position:fixed;inset:0;background:#0c0906f2;display:none;align-items:center;justify-content:center;z-index:9;padding:12px}
#game.on{display:flex}
.gbox{width:100%;max-width:400px}
.ghead{display:flex;justify-content:space-between;align-items:baseline;font:400 18px Anton,sans-serif;letter-spacing:.05em;margin-bottom:6px;gap:8px}
#ghud{color:var(--gold);font-size:16px}
.bar{height:8px;border-radius:6px;background:#2e2c24;overflow:hidden;margin-bottom:8px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3aa0ff,#1c5fb8);transition:width .2s}
#gsvg{width:100%;max-height:62vh;display:block;border-radius:14px;background:#2b2820;touch-action:none;user-select:none;-webkit-user-select:none}
.leak,.bin,.bolt{cursor:pointer}
.spray{animation:spray .5s linear infinite}@keyframes spray{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(14px)}}
.pop{animation:pop .42s ease-out forwards}@keyframes pop{to{opacity:0;transform:translateY(-18px)}}
.gmsg{text-align:center;margin-top:10px;min-height:60px;font-size:14px;color:#e2dac4}
.gmsg b{font:400 26px Anton,sans-serif;color:var(--gold);display:block}
.gd{color:var(--muted);font-size:13px}
.gfoot{display:flex;justify-content:space-between;margin-top:8px}
.gfoot button{font:600 13px Fredoka,sans-serif;background:none;border:1.5px solid #4a3a22;color:var(--muted);border-radius:999px;padding:5px 12px}
@media (prefers-reduced-motion:reduce){.twinkle,.tick,.static,.lava,.lava2,.snow,.flame,.swim{animation:none}}

/* ===== 2026-11 redesign ===== */
body{background:#120c08;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
main{max-width:520px;padding:0 0 24px;position:relative}
main>*:not(.roomwrap):not(.top){margin-left:16px;margin-right:16px}
.top{position:absolute;top:0;left:0;right:0;z-index:3;padding:14px}
.back{display:inline-flex;align-items:center;min-height:36px;padding:0 12px;border-radius:999px;background:rgba(11,7,5,.74);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);font:600 13px Inter,sans-serif;opacity:1}
.coins{background:rgba(11,7,5,.74);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:0;font-size:17px;min-height:36px}
.roomwrap{position:relative}
.roomwrap::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(18,12,8,.7) 0,rgba(18,12,8,0) 14%,rgba(18,12,8,0) 80%,#120c08 100%)}
#room{border-radius:0;box-shadow:none}
body.sheetopen #room{width:100%;height:calc(52vh - 150px)}
body.sheetopen main>*:not(.roomwrap):not(.top),body.sheetopen #dock{display:none}
.rtitle{display:flex;justify-content:space-between;align-items:baseline;margin-top:-6px;position:relative;z-index:2}
.rtitle h1{margin:0;font-size:28px}.rtitle .k{margin:0;font-size:13px}
#dock{position:static;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;max-width:none;margin:12px 16px 0;padding:0;background:none;border:0;box-shadow:none}
#dock button[data-d="room"]{display:none}
#dock button{min-height:80px;justify-content:center;gap:6px;border-radius:16px;background:#1d140d;border:2px solid #3a2d1c;color:var(--ink);font:700 14px Inter,sans-serif}
#dock button[data-d="play"]{background:var(--gold);border-color:var(--gold);color:#15100a}
#dock button.on{background:#1d140d;color:var(--ink)}
#dock button[data-d="play"].on{background:var(--gold);color:#15100a}
#dock button[hidden]{display:none}
#dock:has(button[data-d="pet"][hidden]){grid-template-columns:repeat(2,minmax(0,1fr))}
.sheet{bottom:calc(68px + env(safe-area-inset-bottom))}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));height:calc(68px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#0b0705;border-top:1px solid #2a2016}
.tabs a{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);text-decoration:none;font:600 12px Inter,sans-serif}
.tabs a svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2}
.tabs a.on{color:var(--gold)}
.tabs a.on::before{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--gold)}
body.gameopen .tabs{display:none}
.lock{padding-top:60px}
.tabs{grid-template-columns:repeat(4,minmax(0,1fr))!important}
</style></head>
<body><main id="app"></main>
<section id="play" class="sheet" aria-label="Play">
  <div class="chead"><b>PLAY · EARN COINS</b><button id="pclose" class="sx" type="button">Done</button></div>
  <div id="pgrid" class="games"></div>
</section>
<section id="cat" class="sheet" aria-label="Catalogue">
  <div class="chead"><b>SHOP</b><button id="cclose" class="sx" type="button">Done</button></div>
  <div id="tabs"></div><div id="grid"></div><div id="cbar"></div>
</section>
<nav id="dock" aria-label="Room menu">
  <button data-d="room" class="on" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11 12 4l9 7v9h-6v-6H9v6H3z"/></svg><span>Room</span></button>
  <button data-d="play" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="7" width="20" height="11" rx="5"/><path d="M7 10v5M4.5 12.5h5" stroke="#15120e" stroke-width="2"/><circle cx="16" cy="11" r="1.4" fill="#15120e"/><circle cx="18" cy="14" r="1.4" fill="#15120e"/></svg><span>Play</span></button>
  <button data-d="cat" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2" fill="none" stroke="currentColor" stroke-width="2"/></svg><span>Shop</span></button>
  <button data-d="pet" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="7" cy="8" r="2.2"/><circle cx="12" cy="6" r="2.2"/><circle cx="17" cy="8" r="2.2"/><path d="M12 11c-4 0-6 4-6 6 0 2 2 2.5 3 2s2-.8 3-.8 2 .3 3 .8 3 0 3-2c0-2-2-6-6-6z"/></svg><span>Pet</span></button>

<div id="game" role="dialog" aria-modal="true" aria-label="Mini game"><div class="gbox">

</div></div>
<script src="pets.js"></script><script src="items.js"></script><script src="games.js"></script><script src="room.js"></script>
<nav class="tabs" aria-label="Site">
  <a href="/" data-t="bed"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 18v-6a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3v6M3 18h18M3 14h18M7 9V6"/></svg>My bed</a>
  <a href="/room/" data-t="room" id="navRoom" class="on" aria-current="page"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 21V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v16M2 21h20M14 12h.01"/></svg>My room</a>
  <a href="/room/" data-t="play"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="6"/><path d="M6 12h4M8 10v4M15 13h.01M18 11h.01"/></svg>Play</a>
  <a href="/founders/" data-t="founders"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 2l3 6 6 1-4.5 4.5L18 20l-6-3-6 3 1.5-6.5L3 9l6-1z"/></svg>Founders</a>
</nav>
<script>(()=>{const t=document.querySelector('.tabs [data-t="play"]');if(!t)return;
t.addEventListener('click',e=>{const b=document.querySelector('#dock [data-d="play"]');
if(b&&document.getElementById('room')){e.preventDefault();b.click();return;}
try{sessionStorage.setItem('bunkerOpenPlay','1')}catch(x){}});})();</script>
<script>(()=>{const s=document.getElementById("dockSlot"),d=document.getElementById("dock");if(s&&d)s.replaceWith(d);
const pb=document.querySelector('#dock [data-d="play"]');let go=null;try{go=sessionStorage.getItem("bunkerOpenPlay");if(document.getElementById("room"))sessionStorage.removeItem("bunkerOpenPlay")}catch(e){}
if(go&&pb&&document.getElementById("room"))setTimeout(()=>pb.click(),250);
const ps=document.getElementById("play"),tr=document.querySelector('.tabs [data-t="room"]'),tp=document.querySelector('.tabs [data-t="play"]');
if(ps&&tr&&tp)new MutationObserver(()=>{const o=ps.classList.contains("on");tp.classList.toggle("on",o);tr.classList.toggle("on",!o);}).observe(ps,{attributes:true,attributeFilter:["class"]});
})();</script>
